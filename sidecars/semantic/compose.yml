name: rdf-semantic
services:
  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports: ["${RDF_PUBLISH_HOST:-127.0.0.1}:16333:6333"]
    volumes: ["qdrant-data:/qdrant/storage"]
    restart: unless-stopped
  embeddings:
    build: ./embeddings
    ports: ["${RDF_PUBLISH_HOST:-127.0.0.1}:18081:8081"]
    environment:
      EMBEDDING_DEVICE: cpu
      HF_HOME: /models
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
    volumes: ["embedding-models:/models"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=5)"]
      interval: 15s
      timeout: 6s
      start_period: 180s
      retries: 5
volumes:
  qdrant-data:
  embedding-models:
