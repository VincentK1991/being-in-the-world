[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
authors = ["RDF Store Contributors"]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.85"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
assert_cmd = "2.0.16"
axum = "0.8.1"
clap = { version = "4.5.32", features = ["derive"] }
criterion = "0.5.1"
insta = "1.43.1"
logos = "0.15.0"
predicates = "3.1.3"
proptest = "1.6.0"
oxiri = "0.2.11"
redb = "2.4.0"
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "1.16.0", features = ["v4"] }
winnow = "0.7.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
unimplemented = "deny"
