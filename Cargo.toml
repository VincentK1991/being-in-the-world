[workspace]
members = ["crates/rdf-model", "crates/rdf-io", "crates/rdf-store", "crates/rdf-cli", "crates/rdf-server", "crates/rdf-testkit", "crates/rdf-engine", "crates/rdf-plugin-api", "plugins/dataset-summary", "plugins/custom-properties", "plugins/semantic-search", "crates/rdf-embedding-api", "plugins/embedding-providers", "plugins/inference", "plugins/inference-providers", "plugins/federation", "plugins/catalog", "plugins/shacl", "crates/rdf-mcp"]
exclude = ["crates/sparql-syntax", "crates/sparql-eval", "crates/sparql-opt", "crates/rdf-reasoner", "crates/rdf-vec"]
resolver = "2"

[workspace.package]
authors = ["RDF Store Contributors"]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.93"
version = "0.1.0"

[workspace.dependencies]
oxigraph = { version = "=0.5.13", default-features = false, features = ["rocksdb"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
anyhow = "1.0.100"
assert_cmd = "2.0.16"
axum = "0.8.1"
clap = { version = "4.5.32", features = ["derive"] }
criterion = "0.5.1"
insta = "1.43.1"
logos = "0.15.0"
predicates = "3.1.3"
proptest = "1.6.0"
oxiri = "0.2.11"
redb = "2.4.0"
thiserror = "2.0.12"
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
uuid = { version = "1.16.0", features = ["v4"] }
winnow = "0.7.4"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
unimplemented = "deny"

# The native OWL 2 RL engine is CPU-bound; keep it optimised in the debug builds the local stack runs.
[profile.dev.package.rdf-inference-providers]
opt-level = 3
