name: Rust Foundation CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  foundation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Native storage build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev cmake pkg-config

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Format
        run: cargo fmt --all --check

      - name: Studio runtime
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Studio check and build
        run: |
          npm ci --prefix apps/studio
          npm run check --prefix apps/studio
          npm run build --prefix apps/studio
          npm audit --prefix apps/studio

      - name: Compiler check
        run: cargo check --workspace --all-targets

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo nextest run --workspace --all-targets

      - name: Browser behavior tests
        run: |
          cargo build --locked -p rdf-cli
          npm ci --prefix scripts/ui
          cd scripts/ui
          npx playwright install --with-deps chromium
          npm test

      - name: Dependency policy
        run: cargo deny check
