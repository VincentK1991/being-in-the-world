# Hot-reload overlay used by `just dev` (scripts/dev.sh): `compose.yml` + this file.
# No bind mounts (Docker Desktop cannot mount the WSL distro unless its WSL integration is on):
# scripts/dev.sh copies changed files into the running containers instead.
# ui:      Astro dev server (HMR); edits under apps/studio are copied in and reload the browser.
# backend: Rust edits rebuild target/debug/rdftool on the host; the binary is copied in and the backend restarts.
services:
  backend:
  ui:
    build:
      dockerfile: deploy/local/ui.dev.Dockerfile
    environment:
      RDF_BACKEND_URL: http://backend:7878
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4321/').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 12
