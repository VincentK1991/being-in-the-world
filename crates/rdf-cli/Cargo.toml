[package]
name = "rdf-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "rdftool"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
rdf-inference-providers = { path = "../../plugins/inference-providers" }
rdf-plugin-inference = { path = "../../plugins/inference" }
rdf-embedding-api = { path = "../../crates/rdf-embedding-api" }
rdf-embedding-providers = { path = "../../plugins/embedding-providers" }
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rdf-server = { path = "../rdf-server" }
rdf-engine = { path = "../rdf-engine" }
rdf-plugin-dataset-summary = { path = "../../plugins/dataset-summary" }
rdf-plugin-custom-properties = { path = "../../plugins/custom-properties" }
rdf-plugin-semantic-search = { path = "../../plugins/semantic-search" }
rdf-plugin-federation = { path = "../../plugins/federation" }
rdf-plugin-catalog = { path = "../../plugins/catalog" }
anyhow.workspace = true
clap.workspace = true
rdf-io = { path = "../rdf-io" }
rdf-model = { path = "../rdf-model" }
rdf-store = { path = "../rdf-store" }
rdf-testkit = { path = "../rdf-testkit" }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3.15.0"
assert_cmd.workspace = true
insta.workspace = true
predicates.workspace = true
